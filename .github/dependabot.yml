# Weekly pull requests that keep dependencies up to date.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      # CodeQL's init, analyze and upload-sarif actions must run the same
      # version, so they are always updated together in one pull request.
      codeql-action:
        patterns: ["github/codeql-action/*"]
