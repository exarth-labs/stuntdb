# The secrets rule pack: passwords, keys, tokens and other credentials.
#
# A production secret copied into a development database still works, so a
# column these rules match is always replaced: "stuntdb check" refuses keep
# for it. The format is described in core.yaml.
#
# A wrong match here cannot be overridden with keep, so every name must be
# specific. When in doubt, leave a name out: a column that no rule matches
# is never copied until someone reviews it.

version: 1
pack: secrets

rules:
  - id: password
    class: secret
    use: password_hash
    confidence: 0.95
    types: [string, text, binary]
    names:
      - password
      - passwd
      - pwd
      - passwordhash
      - password hash
      - password digest
      - hashed password
      - encrypted password
      - crypted password
      - pin hash
      - contrasena
      - mot de passe
      - passwort
      - kennwort
      - senha

  - id: api_key
    class: secret
    use: random_token
    confidence: 0.9
    types: [string, text, binary, uuid]
    names:
      - apikey
      - api key
      - access key
      - secret key
      - secret access key
      - private key
      - signing key
      - encryption key
      - master key
      - license key
      - consumer key
      - app key

  - id: token
    class: secret
    use: random_token
    confidence: 0.9
    types: [string, text, binary, uuid, json]
    names:
      - token
      - accesstoken
      - refreshtoken
      - authtoken
      - apitoken
      - jwt
      - password salt
      - recovery code
      - backup code

  - id: secret
    class: secret
    use: random_token
    confidence: 0.9
    types: [string, text, binary, json]
    names:
      - secret
      - clientsecret
      - secret answer
      - security answer

  - id: one_time_code
    class: secret
    use: random_token
    confidence: 0.85
    types: [string, text, int, decimal]
    names:
      - otp
      - otp code
      - one time password
      - one time code
      - verification code
      - auth code
      - authorization code
      - pin code
      - card pin
      - pin number
      - cvv
      - cvc
      - security code
      - card verification code

  - id: session
    class: secret
    use: random_token
    confidence: 0.85
    types: [string, text, binary, json]
    names:
      - session id
      - sessionid
      - session key
      - session data
      - session cookie

  - id: credentials
    class: secret
    use: redact
    confidence: 0.8
    types: [string, text, binary, json]
    names:
      - credential
      - connection string
      - connectionstring
      - dsn
      - database url
      - authorization header
